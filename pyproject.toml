[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tre-dllm"
version = "0.1.0"
description = "Training-free hallucination detection via temporal-weighted revealing entropy"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
